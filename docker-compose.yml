name: bigdata-log-anomaly

# Kien truc ha tang:
#   - spark-master + spark-worker: cum Spark standalone (khong phai local mode)
#     de the hien dung tinh chat "distributed computing" cua de tai Big Data.
#   - namenode + datanode: HDFS lam data lake bronze/silver/gold khi demo.
#     Thu muc local ./data van duoc mount vao container Spark de dev/debug
#     nhanh (mo truc tiep Parquet/JSONL tren host); moi job nhan duong dan qua
#     tham so nen doi sang hdfs://namenode:9000/lake/... khong can sua code.
#   - elasticsearch + kibana: tang serving - log da lam sach, feature, anomaly
#     score, canh bao; Kibana dung dashboard va alert rule.
# Bien moi truong lay tu .env (copy tu .env.example).

services:
  spark-master:
    image: bigdata-log-anomaly/spark:${SPARK_IMAGE_TAG}
    build:
      context: ./docker/spark
      args:
        SPARK_IMAGE_TAG: ${SPARK_IMAGE_TAG}
        ES_SPARK_VERSION: ${ELASTIC_STACK_VERSION}   # connector cung version voi ES
    container_name: spark-master
    user: root   # can root de ghi duoc vao bind mount ./data tren Windows/WSL2
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
    ports:
      # Cong host doi duoc qua .env neu trung voi project khac tren may.
      # 7077 (RPC) khong publish: spark-submit chay ben trong container.
      - "${SPARK_MASTER_UI_PORT:-8080}:8080"   # Spark master Web UI
      - "${SPARK_DRIVER_UI_PORT:-4040}:4040"   # Spark application UI (job dang chay)
    volumes:
      - ./data:/opt/spark/data
      - ./jobs:/opt/spark/jobs
    networks:
      - lakenet

  spark-worker:
    image: bigdata-log-anomaly/spark:${SPARK_IMAGE_TAG}
    container_name: spark-worker
    user: root
    depends_on:
      - spark-master
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --cores
      - ${SPARK_WORKER_CORES}
      - --memory
      - ${SPARK_WORKER_MEMORY}
      - --webui-port
      - "8081"
    ports:
      - "${SPARK_WORKER_UI_PORT:-8081}:8081"   # Spark worker Web UI
    volumes:
      - ./data:/opt/spark/data
      - ./jobs:/opt/spark/jobs
    networks:
      - lakenet

  namenode:
    image: bde2020/hadoop-namenode:${HADOOP_IMAGE_TAG}
    container_name: namenode
    environment:
      - CLUSTER_NAME=loglake
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      # 1 datanode duy nhat -> replication 1, tat permission de Spark (root)
      # ghi duoc vao /lake ma khong can tao user HDFS rieng.
      - HDFS_CONF_dfs_replication=1
      - HDFS_CONF_dfs_permissions_enabled=false
      - HDFS_CONF_dfs_webhdfs_enabled=true
    ports:
      - "9870:9870"   # NameNode Web UI
      - "9000:9000"   # HDFS RPC
    volumes:
      - hdfs_namenode:/hadoop/dfs/name
      - ./data:/data:ro   # nguon cho `hdfs dfs -put` (scripts/hdfs_put.*)
    networks:
      - lakenet

  datanode:
    image: bde2020/hadoop-datanode:${HADOOP_IMAGE_TAG}
    container_name: datanode
    depends_on:
      - namenode
    environment:
      - SERVICE_PRECONDITION=namenode:9870
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - HDFS_CONF_dfs_replication=1
      - HDFS_CONF_dfs_permissions_enabled=false
      - HDFS_CONF_dfs_webhdfs_enabled=true
    ports:
      - "9864:9864"   # DataNode Web UI
    volumes:
      - hdfs_datanode:/hadoop/dfs/data
    networks:
      - lakenet

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_STACK_VERSION}
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=${ES_JAVA_OPTS}
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - lakenet
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELASTIC_STACK_VERSION}
    container_name: kibana
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      # Bat buoc de dung Alerting (rule + connector): Kibana can khoa ma hoa
      # saved object, thieu khoa nay muc Rules se bi khoa.
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=${KIBANA_ENCRYPTION_KEY}
    ports:
      - "5601:5601"
    networks:
      - lakenet

networks:
  lakenet:
    driver: bridge

volumes:
  es_data:
  hdfs_namenode:
  hdfs_datanode:
